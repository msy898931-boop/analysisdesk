name: security

# Two checks that do not need a running service: a static analysis of the code
# (CodeQL) and a scan for secrets that were committed by mistake. Both run on
# every push and pull request, and weekly on a schedule so a newly-published
# CodeQL query can flag code that was clean when it was written.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays at 06:17 UTC, off the hour so it does not queue behind the crowd.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: codeql
    runs-on: ubuntu-24.04
    permissions:
      # CodeQL needs to write its findings to the security tab.
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-and-quality

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: a secret removed in a later commit is still a leak,
          # and a shallow clone would only see the current tree.
          fetch-depth: 0

      - name: Scan the history for secrets
        # gitleaks walks every commit, not just the tip, so a key that was
        # committed and then deleted is still caught. It uses its built-in rules
        # unless a .gitleaks.toml overrides them.
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
