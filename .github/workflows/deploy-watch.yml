name: deploy-watch

# Watch the deployed service without changing it.
#
# The probe reads /robots.txt, which Render answers itself while a Free service
# is spun down. That reply never reaches the app and never wakes it, so this job
# costs zero instance hours. Probing /api/health on a schedule would wake the
# service every 30 minutes and burn the 750-hour monthly allowance -- the check
# would destroy the thing it measures.
#
# Why there is also a push trigger: GitHub's `schedule` is best-effort and, in
# practice, heavily throttled -- this workflow was added with a */30 cron and
# produced ZERO scheduled runs while a sibling repo's */5 cron fired only every
# 4-6 hours. A watchdog that never runs is silent in the same way a healthy
# service is. So every deploy is verified by the event that actually fires
# reliably (push), and the schedule stays as a best-effort backstop. The probe
# never wakes the service, so running it more often costs nothing.
#
# Sleeping is normal on the free plan, so it is NOT alerted. The job alerts only
# when the state cannot be determined, when the app is awake but unhealthy, or
# when the watchdog itself has gone quiet (check_deploy --gap-threshold).
#
# Silence is never reported as an all-clear.

on:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_alert:
        description: "Send a test alert through every configured channel"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: deploy-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Restore the reading log
        uses: actions/cache/restore@v4
        with:
          path: .watchdog
          key: watchdog-${{ github.run_id }}
          restore-keys: watchdog-

      - name: Probe the deployment
        id: probe
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p .watchdog
          # On push, prove the revision that was just pushed is the one running:
          # a green check that only says "something is serving" would be the same
          # false all-clear this desk refuses. On a schedule there is nothing to
          # prove, so no --expect-commit and the probe stays zero-wake.
          EXPECT=""
          if [ "${{ github.event_name }}" = "push" ]; then
            # A Docker image build on Render takes minutes, so wait generously
            # before concluding the deploy has not landed. --max-errors 0: a
            # fresh process that has already logged an unhandled error is a
            # failed deploy even though /api/health says ok.
            EXPECT="--expect-commit ${{ github.sha }} --wait-seconds 600 --max-errors 0"
          fi
          # --gap-threshold 12: GitHub's throttled cron makes gaps of several
          # hours normal, so a tighter threshold would cry wolf on a healthy
          # schedule and train the reader to ignore it. 12h is the line between
          # "throttled but alive" and "the watchdog is actually dead".
          python3 scripts/check_deploy.py --log .watchdog/readings.jsonl \
            --gap-threshold 12 $EXPECT --json \
            > .watchdog/last.json || echo "probe reported a problem"
          cat .watchdog/last.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d = json.load(open(".watchdog/last.json"))
          print(f"state={d['state']}")
          print(f"ok={'true' if d['ok'] else 'false'}")
          print(f"reason={d['reason']}")
          PY

      - name: Save the reading log
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .watchdog
          key: watchdog-${{ github.run_id }}

      - name: Weekly usage digest
        if: github.event_name == 'schedule' && vars.FREE_SERVICES != ''
        continue-on-error: true
        run: |
          [ "$(date -u +%u)" = "1" ] || exit 0   # Mondays only
          python3 scripts/hours_audit.py --log .watchdog/readings.jsonl \
            --services "${FREE_SERVICES}"

      - name: Alert on a real problem
        if: steps.probe.outputs.ok != 'true' || inputs.force_alert
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.force_alert }}" = "true" ]; then
            STATE="test"
            REASON="manual test alert (workflow_dispatch) — not a real failure"
          else
            STATE="${{ steps.probe.outputs.state || 'unknown' }}"
            REASON="${{ steps.probe.outputs.reason || 'the probe produced no verdict' }}"
          fi
          python3 scripts/alert.py open --state "$STATE" --reason "$REASON"

      - name: Close the alert once it recovers
        if: steps.probe.outputs.ok == 'true' && !inputs.force_alert
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/alert.py close
