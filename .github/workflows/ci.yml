name: ci

# Run the suite on every push and pull request. Without this, a change that
# breaks one of the tests still reaches production -- the tests only protect us
# if something runs them. Lint and a dependency audit run alongside, so a
# security regression is caught in the same place as a logic one.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pin the runner image rather than track `latest`: a silent OS migration
    # should not be able to turn a green build red on its own.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # One source of truth: the runtime deps and the dev tools both live in
        # pyproject.toml. requirements.txt is kept in step and asserted equal by
        # a test, so the two cannot quietly diverge.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: The lock must match requirements.txt
        # The image installs the lock, not requirements.txt. If the lock pins a
        # version the declared range no longer allows -- someone bumped
        # `fastapi>=0.170` and forgot to regenerate -- then CI tests a dependency
        # set production does not have. This checks that deterministically,
        # without a fresh resolve that a routine upstream release would break.
        run: python scripts/check_lock.py

      - name: Tests
        # Network tests are deselected: CI must not depend on a third party
        # being up, or a red build would mean "Yahoo was slow", not "we broke it".
        run: python -m pytest tests/ -m "not network" --cov=app --cov-report=term-missing

      - name: Lint
        run: ruff check app/ tests/ scripts/

      - name: Types
        run: mypy

      - name: Security scan
        run: bandit -q -r app/ scripts/ -ll

      - name: Dependency audit
        # Audit the lock, not the ranges: the lock is what the image installs,
        # and pip-audit on `>=` specs would resolve to a set that is neither what
        # ships nor necessarily what CI tested.
        run: pip-audit -r requirements.lock

  ui:
    # The card is half the product and none of the Python tests touch it. This
    # job runs the browser-side helpers under node's own test runner.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: UI unit tests
        run: node --test web/app.test.mjs

  docker:
    # "Green in CI" and "the image builds" were two different facts: nothing
    # built the Dockerfile, so a change to it could only fail on the deploy. This
    # job builds the image the way production does and asks it to answer, so the
    # build and the healthcheck are proven before a push reaches Render.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Build the image
        run: docker build -t analysisdesk:ci .

      - name: Run it and wait for health
        run: |
          docker run -d --name desk -p 127.0.0.1:12000:12000 -e PORT=12000 analysisdesk:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:12000/api/health > /tmp/health.json; then
              echo "healthy after ${i}s: $(cat /tmp/health.json)"
              exit 0
            fi
            sleep 1
          done
          echo "the image never became healthy"; docker logs desk; exit 1

      - name: It must not run as root
        run: |
          uid=$(docker exec desk id -u)
          test "$uid" != "0" || { echo "the container runs as root"; exit 1; }
          echo "runs as uid $uid"

      - name: Show logs on failure
        if: failure()
        run: docker logs desk
