[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "analysisdesk"
version = "1.1.0"
description = "Transparent technical analysis over real market data, with an AI layer that only explains."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "AnalysisDesk" }]
keywords = ["technical-analysis", "trading", "market-data", "fastapi"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]

# The runtime set. requirements.txt mirrors this list, and a test asserts the two
# cannot drift apart -- two hand-kept copies of one fact is how they diverge.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
    "pip-audit>=2.7",
    # The test client's supported HTTP library. Starlette 1.x prefers httpx2 and
    # only falls back to httpx with a deprecation warning, so this is installed
    # for the tests, not by the app -- the runtime code still imports httpx
    # directly. Naming it here keeps the warning from becoming noise that hides
    # the next real one.
    "httpx2>=2.16",
]

[project.urls]
Homepage = "https://github.com/msy898931-boop/analysisdesk"

[tool.setuptools]
packages = ["app"]

# --------------------------------------------------------------------- ruff
# Pragmatic, not maximal. The signal engine compares against thresholds whose
# value is their meaning (RSI 70, ATR 1.5); naming each one would hide the rule
# rather than clarify it. Everything that is a real defect stays enabled.
[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "S", "B", "UP", "SIM", "PL"]
ignore = [
    "E501",     # line length is the formatter's job
    "PLR2004",  # a threshold literal is the rule, not a magic number
    "PLR0912", "PLR0915",  # the signal engine is one long, auditable function
    "E741",  # `l` is the low of an OHLC candle; renaming it hurts readability
    "SIM102", "PLR0911",  # the guard reads as a decision list on purpose
    "S110",   # the rate-limit hint is best-effort; the caller still fails
]

[tool.ruff.lint.per-file-ignores]
# Tests import locally to keep the failure next to what it exercises, and shell
# out to `node --test` with a path built from __file__ (S603).
"tests/*" = ["S101", "PLC0415", "PLR2004", "F841", "F401", "B011", "S603"]
"scripts/*" = ["S603", "S607", "PLW1510", "PLW2901"]  # gh CLI and a deliberate rebind

# ------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: touches a live third-party API; deselected in CI so a red build means our code broke, not that a provider was slow.",
]

# ------------------------------------------------------------------ coverage
[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
# The market layer talks to four live venues; the lines that only run against a
# real upstream are exercised by the network-marked tests, which CI deselects.
fail_under = 70

# --------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
files = ["app"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
