# Render blueprint for AnalysisDesk.
#
# Free plan note: the instance sleeps after ~15 minutes idle and cold-starts on
# the next request. Nothing is persisted, and the app keeps no state on disk
# (caches live in memory only), so a cold start costs latency, not correctness.
services:
  - type: web
    name: analysisdesk
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Declared with no value so the key is set in the dashboard, never in git.
      # Without it the app still works: it falls back to the computed explanation.
      - key: GROQ_API_KEY
        sync: false
      # Per-IP requests per minute against the analysis endpoints. Kept as a
      # variable so it can be raised without a rebuild if real use needs it.
      - key: RATE_LIMIT_PER_MIN
        value: "60"
      # Optional. Leave unset and the API is open (rate-limited only). Set it to
      # require a key from callers that are not the bundled page.
      - key: DESK_API_KEY
        sync: false
