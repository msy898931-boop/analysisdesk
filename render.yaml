# Render blueprint for AnalysisDesk.
#
# Free plan note: the instance sleeps after ~15 minutes idle and cold-starts on
# the next request. The cache and the rate limiter live in memory, so a cold
# start costs latency, not correctness. Alert subscriptions are written to a
# SQLite file on the container disk (DESK_DATA_DIR, default data/); with no
# mounted disk on the free plan that file is lost on redeploy/restart, so
# /api/status reports store.durable:false. Mount a Render Disk and point
# DESK_DATA_DIR at it to make alerts survive.
services:
  - type: web
    name: analysisdesk
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Declared with no value so the key is set in the dashboard, never in git.
      # Without it the app still works: it falls back to the computed explanation.
      - key: GROQ_API_KEY
        sync: false
      # Per-IP requests per minute against the analysis endpoints. Kept as a
      # variable so it can be raised without a rebuild if real use needs it.
      - key: RATE_LIMIT_PER_MIN
        value: "60"
      # Optional. When set, every caller must present it -- there is no page
      # exemption (a public page cannot hold a secret). Leave unset and the API
      # is open but rate-limited, which is what production does.
      - key: DESK_API_KEY
        sync: false
