<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnalysisDesk — تحليل فني شفّاف</title>
<style>
  :root{
    --bg:#0a0e13; --panel:#111821; --panel2:#151d28; --line:#1e2a38;
    --txt:#e6edf3; --dim:#7d8b9a; --teal:#00d4aa; --up:#26a269; --down:#e5534b;
    --warn:#f0a020; --gold:#e3b341;
    --r:14px; --shadow:0 10px 40px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--txt);
    font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
  body{background-image:radial-gradient(900px 500px at 85% -10%,rgba(0,212,170,.08),transparent 60%),
    radial-gradient(700px 400px at 0% 0%,rgba(227,179,65,.05),transparent 55%);min-height:100vh}
  .wrap{max-width:1240px;margin:0 auto;padding:26px 20px 60px}

  header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--teal),#0b8f78);
    display:grid;place-items:center;font-weight:800;color:#04120f;font-size:19px;box-shadow:0 6px 18px rgba(0,212,170,.25)}
  .brand h1{margin:0;font-size:19px;letter-spacing:.2px}
  .brand p{margin:2px 0 0;font-size:12px;color:var(--dim)}
  .lang{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:4px}
  .lang button{background:none;border:0;color:var(--dim);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600}
  .lang button.on{background:var(--teal);color:#04120f}
  .hdr-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .pitchlink{display:inline-block;text-decoration:none;color:var(--dim);border:1px solid var(--line);
    background:var(--panel);border-radius:11px;padding:9px 15px;font-size:13px;font-weight:600;transition:.15s}
  .pitchlink:hover{border-color:var(--teal);color:var(--txt)}

  .controls{display:grid;grid-template-columns:1fr auto;gap:12px;margin-bottom:18px}
  .card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);
    border-radius:var(--r);box-shadow:var(--shadow)}
  .pickers{display:flex;gap:10px;padding:12px;flex-wrap:wrap;align-items:center}
  select{background:#0d141c;color:var(--txt);border:1px solid var(--line);border-radius:10px;
    padding:11px 13px;font-size:14px;min-width:170px;cursor:pointer}
  select:focus{outline:2px solid rgba(0,212,170,.35);border-color:var(--teal)}
  .go{background:linear-gradient(135deg,var(--teal),#0aa387);color:#04120f;border:0;border-radius:10px;
    padding:12px 26px;font-weight:800;font-size:14px;cursor:pointer;letter-spacing:.3px}
  .go:disabled{opacity:.5;cursor:progress}
  .chiprow{display:flex;gap:8px;flex-wrap:wrap;padding:12px}
  .chip{background:#0d141c;border:1px solid var(--line);color:var(--dim);border-radius:9px;
    padding:7px 12px;font-size:12.5px;cursor:pointer;transition:.15s}
  .chip:hover{border-color:var(--teal);color:var(--txt)}

  .grid{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;margin-top:16px}
  @media(max-width:900px){.grid{grid-template-columns:1fr}}
  .pad{padding:16px 18px}
  .h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .h h2{margin:0;font-size:14px;font-weight:700;letter-spacing:.3px;color:var(--txt)}
  .h .sub{font-size:11.5px;color:var(--dim)}
  .badge{font-size:11px;padding:4px 10px;border-radius:20px;font-weight:700;border:1px solid transparent}
  .b-live{background:rgba(0,212,170,.12);color:var(--teal);border-color:rgba(0,212,170,.3)}

  .verdict{display:flex;align-items:center;gap:18px;padding:18px;border-radius:12px;
    background:#0d141c;border:1px solid var(--line);margin-bottom:14px}
  .dir{font-size:26px;font-weight:900;letter-spacing:1px}
  .BUY{color:var(--up)} .SELL{color:var(--down)} .NEUTRAL{color:var(--warn)}
  .price{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
  .chg{font-size:13px;font-weight:700}
  .meter{height:8px;border-radius:6px;background:#0d141c;border:1px solid var(--line);overflow:hidden;margin-top:8px}
  .meter i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#0aa387)}
  .kv{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
  .prov{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;font-size:11px;color:var(--dim)}
  .prov span{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);
    border-radius:6px;padding:3px 8px}
  .prov span b{color:var(--txt)}
  .prov .provmiss{color:var(--down);border-color:rgba(255,90,90,.3)}
  .kv div{background:#0d141c;border:1px solid var(--line);border-radius:10px;padding:11px 13px}
  .kv span{display:block;font-size:11px;color:var(--dim);margin-bottom:4px}
  .kv b{font-size:15px;font-variant-numeric:tabular-nums}

  .ladder{display:flex;flex-direction:column;gap:8px}
  .rung{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;
    background:#0d141c;border:1px solid var(--line);border-radius:10px;padding:10px 13px;
    border-inline-start:3px solid var(--line)}
  .rung.lvl{border-inline-start-color:var(--teal)}
  .rung.proj{border-inline-start-color:var(--warn)}
  .rung .n{font-size:12px;font-weight:700;color:var(--dim);font-variant-numeric:tabular-nums}
  .rung .px{font-size:15px;color:var(--up);font-variant-numeric:tabular-nums}
  .rung .rr{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
  .rung .tag{font-size:10.5px;font-weight:700;border-radius:6px;padding:3px 8px;white-space:nowrap;
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:var(--dim)}
  .rung .tag i{display:block;font-style:normal;font-weight:400;font-size:9.5px;color:var(--dim);margin-top:2px}
  .rung.lvl .tag{color:var(--teal);border-color:rgba(0,212,170,.3)}
  .rung.proj .tag{color:var(--warn);border-color:rgba(240,160,32,.3)}
  @media(max-width:560px){
    .rung{grid-template-columns:auto 1fr auto;gap:8px}
    .rung .tag{grid-column:1/-1}
  }

  .rules{display:flex;flex-direction:column;gap:8px}
  .rule{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;
    background:#0d141c;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .dot{width:8px;height:8px;border-radius:50%}
  .rule .txt{font-size:12.5px;line-height:1.5}
  .rule .txt b{display:block;font-size:12px;color:var(--txt);margin-bottom:2px;font-weight:600}
  .rule .txt i{font-style:normal;color:var(--dim)}
  .rule .w{font-size:11px;font-weight:800;color:var(--dim);font-variant-numeric:tabular-nums}

  .ai{background:linear-gradient(180deg,rgba(0,212,170,.06),rgba(0,212,170,.02));
    border:1px solid rgba(0,212,170,.22);border-radius:12px;padding:15px;font-size:13.5px;line-height:1.85}
  .ai .meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:9px}
  .ai .meta span{font-size:10.5px;background:#0d141c;border:1px solid var(--line);
    color:var(--dim);padding:3px 9px;border-radius:20px}

  .warns{display:flex;flex-direction:column;gap:7px;margin-top:12px}
  .warn{background:rgba(240,160,32,.07);border:1px solid rgba(240,160,32,.28);color:#f5c77e;
    border-radius:10px;padding:9px 12px;font-size:12.5px}

  canvas{width:100%;height:260px;display:block}
  .err{background:rgba(229,83,75,.08);border:1px solid rgba(229,83,75,.35);color:#ffb3ae;
    border-radius:12px;padding:16px;font-size:13.5px;line-height:1.7}
  .skel{height:120px;border-radius:12px;background:linear-gradient(90deg,#111821,#18222e,#111821);
    background-size:200% 100%;animation:sh 1.2s infinite}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
  footer{margin-top:22px;font-size:11.5px;color:var(--dim);line-height:1.8;text-align:center}
  .disclaim{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}

  /* Screen-reader-only: keeps the chart description reachable without showing it. */
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0 0 0 0);white-space:nowrap;border:0}

  /* Keyboard users must be able to see where they are; the default ring is
     invisible on this dark background. */
  button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

  /* Respect a stated preference for less motion: the skeleton stops shimmering. */
  @media(prefers-reduced-motion:reduce){
    .skel{animation:none}
    *{scroll-behavior:auto}
  }

  /* Narrow screens: the controls stack, the chart keeps its height, and the
     provenance chips wrap instead of overflowing. */
  @media(max-width:560px){
    .wrap{padding:16px 12px 44px}
    .controls{grid-template-columns:1fr}
    .pickers{flex-direction:column;align-items:stretch}
    select,.go{width:100%}
    .verdict{flex-direction:column;align-items:flex-start;gap:10px}
    canvas{height:220px}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="logo">◈</div>
      <div>
        <h1 id="title">AnalysisDesk</h1>
        <p id="tagline">تحليل فني شفّاف على بيانات سوق حقيقية</p>
      </div>
    </div>
    <div class="hdr-right">
      <a id="pitch" class="pitchlink" href="/pitch">العرض</a>
      <div class="lang" role="group" aria-label="Language / اللغة">
        <button id="l-ar" class="on" aria-pressed="true">العربية</button>
        <button id="l-en" aria-pressed="false">English</button>
      </div>
    </div>
  </header>

  <div class="card">
    <div class="pickers">
      <label for="sym" class="sr-only">Symbol / الأداة</label>
      <select id="sym"></select>
      <label for="iv" class="sr-only">Timeframe / الفريم</label>
      <select id="iv"></select>
      <button class="go" id="go">تحليل</button>
      <span id="status" class="sub" role="status" aria-live="polite"
            style="color:var(--dim);font-size:12px"></span>
    </div>
    <div class="chiprow" id="chips"></div>
  </div>

  <div id="out"></div>

  <footer>
    <div id="footline"></div>
    <div class="disclaim" id="disc"></div>
  </footer>
</div>

<script type="module" src="/static/app.js" defer></script>
</body>
</html>
