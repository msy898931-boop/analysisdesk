<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnalysisDesk — تحليل فني شفّاف</title>
<style>
  :root{
    --bg:#0a0e13; --panel:#111821; --panel2:#151d28; --line:#1e2a38;
    --txt:#e6edf3; --dim:#7d8b9a; --teal:#00d4aa; --up:#26a269; --down:#e5534b;
    --warn:#f0a020; --gold:#e3b341;
    --r:14px; --shadow:0 10px 40px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--txt);
    font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
  body{background-image:radial-gradient(900px 500px at 85% -10%,rgba(0,212,170,.08),transparent 60%),
    radial-gradient(700px 400px at 0% 0%,rgba(227,179,65,.05),transparent 55%);min-height:100vh}
  .wrap{max-width:1240px;margin:0 auto;padding:26px 20px 60px}

  header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--teal),#0b8f78);
    display:grid;place-items:center;font-weight:800;color:#04120f;font-size:19px;box-shadow:0 6px 18px rgba(0,212,170,.25)}
  .brand h1{margin:0;font-size:19px;letter-spacing:.2px}
  .brand p{margin:2px 0 0;font-size:12px;color:var(--dim)}
  .lang{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:4px}
  .lang button{background:none;border:0;color:var(--dim);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600}
  .lang button.on{background:var(--teal);color:#04120f}

  .controls{display:grid;grid-template-columns:1fr auto;gap:12px;margin-bottom:18px}
  .card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);
    border-radius:var(--r);box-shadow:var(--shadow)}
  .pickers{display:flex;gap:10px;padding:12px;flex-wrap:wrap;align-items:center}
  select{background:#0d141c;color:var(--txt);border:1px solid var(--line);border-radius:10px;
    padding:11px 13px;font-size:14px;min-width:170px;cursor:pointer}
  select:focus{outline:2px solid rgba(0,212,170,.35);border-color:var(--teal)}
  .go{background:linear-gradient(135deg,var(--teal),#0aa387);color:#04120f;border:0;border-radius:10px;
    padding:12px 26px;font-weight:800;font-size:14px;cursor:pointer;letter-spacing:.3px}
  .go:disabled{opacity:.5;cursor:progress}
  .chiprow{display:flex;gap:8px;flex-wrap:wrap;padding:12px}
  .chip{background:#0d141c;border:1px solid var(--line);color:var(--dim);border-radius:9px;
    padding:7px 12px;font-size:12.5px;cursor:pointer;transition:.15s}
  .chip:hover{border-color:var(--teal);color:var(--txt)}

  .grid{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;margin-top:16px}
  @media(max-width:900px){.grid{grid-template-columns:1fr}}
  .pad{padding:16px 18px}
  .h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .h h2{margin:0;font-size:14px;font-weight:700;letter-spacing:.3px;color:var(--txt)}
  .h .sub{font-size:11.5px;color:var(--dim)}
  .badge{font-size:11px;padding:4px 10px;border-radius:20px;font-weight:700;border:1px solid transparent}
  .b-live{background:rgba(0,212,170,.12);color:var(--teal);border-color:rgba(0,212,170,.3)}

  .verdict{display:flex;align-items:center;gap:18px;padding:18px;border-radius:12px;
    background:#0d141c;border:1px solid var(--line);margin-bottom:14px}
  .dir{font-size:26px;font-weight:900;letter-spacing:1px}
  .BUY{color:var(--up)} .SELL{color:var(--down)} .NEUTRAL{color:var(--warn)}
  .price{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
  .chg{font-size:13px;font-weight:700}
  .meter{height:8px;border-radius:6px;background:#0d141c;border:1px solid var(--line);overflow:hidden;margin-top:8px}
  .meter i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#0aa387)}
  .kv{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
  .prov{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;font-size:11px;color:var(--dim)}
  .prov span{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);
    border-radius:6px;padding:3px 8px}
  .prov span b{color:var(--fg)}
  .prov .provmiss{color:var(--down);border-color:rgba(255,90,90,.3)}
  .kv div{background:#0d141c;border:1px solid var(--line);border-radius:10px;padding:11px 13px}
  .kv span{display:block;font-size:11px;color:var(--dim);margin-bottom:4px}
  .kv b{font-size:15px;font-variant-numeric:tabular-nums}

  .rules{display:flex;flex-direction:column;gap:8px}
  .rule{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;
    background:#0d141c;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .dot{width:8px;height:8px;border-radius:50%}
  .rule .txt{font-size:12.5px;line-height:1.5}
  .rule .txt b{display:block;font-size:12px;color:var(--txt);margin-bottom:2px;font-weight:600}
  .rule .txt i{font-style:normal;color:var(--dim)}
  .rule .w{font-size:11px;font-weight:800;color:var(--dim);font-variant-numeric:tabular-nums}

  .ai{background:linear-gradient(180deg,rgba(0,212,170,.06),rgba(0,212,170,.02));
    border:1px solid rgba(0,212,170,.22);border-radius:12px;padding:15px;font-size:13.5px;line-height:1.85}
  .ai .meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:9px}
  .ai .meta span{font-size:10.5px;background:#0d141c;border:1px solid var(--line);
    color:var(--dim);padding:3px 9px;border-radius:20px}

  .warns{display:flex;flex-direction:column;gap:7px;margin-top:12px}
  .warn{background:rgba(240,160,32,.07);border:1px solid rgba(240,160,32,.28);color:#f5c77e;
    border-radius:10px;padding:9px 12px;font-size:12.5px}

  canvas{width:100%;height:260px;display:block}
  .err{background:rgba(229,83,75,.08);border:1px solid rgba(229,83,75,.35);color:#ffb3ae;
    border-radius:12px;padding:16px;font-size:13.5px;line-height:1.7}
  .skel{height:120px;border-radius:12px;background:linear-gradient(90deg,#111821,#18222e,#111821);
    background-size:200% 100%;animation:sh 1.2s infinite}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
  footer{margin-top:22px;font-size:11.5px;color:var(--dim);line-height:1.8;text-align:center}
  .disclaim{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="logo">◈</div>
      <div>
        <h1 id="title">AnalysisDesk</h1>
        <p id="tagline">تحليل فني شفّاف على بيانات سوق حقيقية</p>
      </div>
    </div>
    <div class="lang">
      <button id="l-ar" class="on" onclick="setLang('ar')">العربية</button>
      <button id="l-en" onclick="setLang('en')">English</button>
    </div>
  </header>

  <div class="card">
    <div class="pickers">
      <select id="sym"></select>
      <select id="iv"></select>
      <button class="go" id="go" onclick="run()">تحليل</button>
      <span id="status" class="sub" style="color:var(--dim);font-size:12px"></span>
    </div>
    <div class="chiprow" id="chips"></div>
  </div>

  <div id="out"></div>

  <footer>
    <div id="footline"></div>
    <div class="disclaim" id="disc"></div>
  </footer>
</div>

<script>
const T = {
  ar:{title:"AnalysisDesk",tagline:"تحليل فني شفّاف على بيانات سوق حقيقية",go:"تحليل",
      reading:"قراءة السوق",agreement:"توافق المؤشرات",entry:"الدخول",sl:"وقف الخسارة",
      tp:"الهدف",rr:"مخاطرة/عائد",support:"الدعم",resistance:"المقاومة",atr:"التقلب (ATR)",
      rsi:"مؤشر القوة RSI",macd:"MACD",stoch:"ستوكاستيك",bands:"بولنجر",
      why:"لماذا هذه القراءة؟",ai:"تفسير الذكاء الاصطناعي",chart:"الشموع (آخر 200)",
      rules:"قاعدة",w:"وزن",notes:"ملاحظات مهمة",live:"بيانات حيّة",of:"من",
      foot:"كل رقم معروض محسوب من بيانات سوق حقيقية عبر Yahoo Finance. لا توجد أي أرقام مُدخلة يدوياً.",
      disc:"تحليل تقني آلي. ليس توصية استثمارية ولا ضماناً لأي نتيجة. توافق المؤشرات ليس احتمال ربح.",
      load:"جارٍ قراءة السوق…",neutral:"لا اتجاه واضح",bull:"صاعد",bear:"هابط",mid:"محايد",
      neutral_note:"المؤشرات متعارضة — القراءة الأمينة هي عدم الدخول.",
      sig:"إشارة",agree:"توافق",model:"الموديل",det:"تفسير محسوب",failed:"تعذّر قراءة السوق",
      instrument:"الأداة",spot:"السبوت",futures:"عقد آجل",basis:"الفرق عن السبوت",track:"مطابقة السبوت",chart_src:"مصدر الشموع"},
  en:{title:"AnalysisDesk",tagline:"Transparent technical analysis on real market data",go:"Analyze",
      reading:"Market read",agreement:"Indicator agreement",entry:"Entry",sl:"Stop loss",
      tp:"Target",rr:"Risk/Reward",support:"Support",resistance:"Resistance",atr:"Volatility (ATR)",
      rsi:"RSI",macd:"MACD",stoch:"Stochastic",bands:"Bollinger",
      why:"Why this read?",ai:"AI explanation",chart:"Candles (last 200)",
      rules:"Rule",w:"Weight",notes:"Important notes",live:"Live data",of:"of",
      foot:"Every figure shown is computed from real market data via Yahoo Finance. No hand-entered numbers.",
      disc:"Automated technical analysis. Not investment advice, no guarantee of any outcome. Indicator agreement is not a probability of profit.",
      load:"Reading the market…",neutral:"No clear direction",bull:"bullish",bear:"bearish",mid:"neutral",
      neutral_note:"Indicators conflict — the honest call is to stand aside.",
      sig:"Signal",agree:"Agreement",model:"Model",det:"Computed explanation",failed:"Could not read the market",
      instrument:"Instrument",spot:"Spot",futures:"Futures",basis:"Basis vs spot",track:"Tracking spot",chart_src:"Candle source"},
};
let LANG="ar", SYMS=[], IVS={}, BUSY=false;

function setLang(l){
  LANG=l;
  document.documentElement.lang=l;
  document.documentElement.dir = l==="ar"?"rtl":"ltr";
  document.getElementById("l-ar").className = l==="ar"?"on":"";
  document.getElementById("l-en").className = l==="en"?"on":"";
  const t=T[l];
  title.textContent=t.title; tagline.textContent=t.tagline;
  go.textContent=t.go; footline.textContent=t.foot; disc.textContent=t.disc;
  renderChips();
  if(last) paint(last);
}

let last=null;

function renderChips(){
  const t=T[LANG], box=document.getElementById("chips");
  box.innerHTML="";
  SYMS.forEach(s=>{
    const b=document.createElement("button");
    b.className="chip";
    b.textContent = LANG==="ar"?s.name_ar:s.name_en;
    b.onclick=()=>{sym.value=s.symbol; run();};
    box.appendChild(b);
  });
}

function fillSelects(){
  sym.innerHTML=""; iv.innerHTML="";
  const groups={};
  SYMS.forEach(s=>{ (groups[s.class]=groups[s.class]||[]).push(s); });
  const gnames={forex:{ar:"عملات",en:"Forex"},crypto:{ar:"كريبتو",en:"Crypto"},
    commodity:{ar:"سلع",en:"Commodities"},index:{ar:"مؤشرات",en:"Indices"},stock:{ar:"أسهم",en:"Stocks"}};
  Object.keys(groups).forEach(g=>{
    const og=document.createElement("optgroup");
    og.label=(gnames[g]||{})[LANG]||g;
    groups[g].forEach(s=>{
      const o=document.createElement("option");
      o.value=s.symbol; o.textContent=(LANG==="ar"?s.name_ar:s.name_en)+" · "+s.symbol;
      og.appendChild(o);
    });
    sym.appendChild(og);
  });
  Object.keys(IVS).forEach(k=>{
    const o=document.createElement("option");
    o.value=k; o.textContent=LANG==="ar"?IVS[k].ar:IVS[k].en;
    iv.appendChild(o);
  });
  sym.value="EURUSD=X"; iv.value="1h";
}

function fmt(n,d=4){
  if(n===null||n===undefined) return "—";
  const a=Math.abs(n);
  const p = a>=1000?2 : a>=10?3 : a>=1?4 : 5;
  return Number(n).toLocaleString("en-US",{minimumFractionDigits:Math.min(p,d),maximumFractionDigits:Math.max(p,d)});
}

async function boot(){
  try{
    const r=await fetch("/api/symbols"); const d=await r.json();
    SYMS=d.symbols; IVS=d.intervals; fillSelects(); renderChips();
  }catch(e){ /* selects stay empty; run() will surface the error */ }
  setLang("ar");
  // Open on a live read rather than an empty panel.
  run();
}

async function run(){
  if(BUSY) return; BUSY=true;
  const t=T[LANG];
  go.disabled=true; status.textContent=t.load;
  out.innerHTML='<div class="card pad" style="margin-top:16px"><div class="skel"></div></div>';
  try{
    const u=`/api/analyze?symbol=${encodeURIComponent(sym.value)}&interval=${iv.value}&lang=${LANG}`;
    const r=await fetch(u);
    if(!r.ok){ const j=await r.json().catch(()=>({})); throw new Error(j.detail||("HTTP "+r.statusCode)); }
    last=await r.json(); paint(last);
    status.textContent="";
  }catch(e){
    out.innerHTML=`<div class="card pad" style="margin-top:16px"><div class="err">
      <b>${t.failed}</b><br>${(e.message||e)+""}</div></div>`;
    status.textContent="";
  }finally{ go.disabled=false; BUSY=false; }
}

function paint(d){
  const t=T[LANG], i=d.indicators, s=d.signal;
  const dirTxt = s.direction==="BUY"?t.bull : s.direction==="SELL"?t.bear : t.neutral;
  const dirCls = s.direction;
  const up = i.change_pct>=0;

  const rules = s.rules.filter(r=>r.weight>0).map(r=>{
    const col = r.vote==="bullish"?"var(--up)":r.vote==="bearish"?"var(--down)":"var(--dim)";
    const vt = r.vote==="bullish"?t.bull : r.vote==="bearish"?t.bear : t.mid;
    const dt = LANG==="ar"?r.detail_ar:r.detail_en;
    return `<div class="rule">
      <span class="dot" style="background:${col}"></span>
      <span class="txt"><b>${r.name}</b><i>${dt}</i></span>
      <span class="w">${vt} · +${r.weight}</span>
    </div>`;
  }).join("");

  const warns = s.warnings.map(w=>`<div class="warn">⚠ ${LANG==="ar"?w.ar:w.en}</div>`).join("");

  const aiMeta = d.narrative.source==="model"
      ? `<span>${t.model}: ${d.narrative.model}</span>`
      : `<span>${t.det}${d.narrative.note?(" · "+d.narrative.note):""}</span>`;

  // Say exactly which instrument this number is. A futures contract and the
  // spot it tracks differ, and hiding that is how a wrong-looking price happens.
  const inst = d.instrument || {};
  let prov = `<div class="prov">`;
  if (inst.name) {
    prov += `<span>${t.instrument}: <b>${inst.name}</b></span>`;
    prov += `<span>${inst.kind==="futures"?t.futures:t.spot}</span>`;
  }
  if (inst.exchange) prov += `<span>${inst.exchange}</span>`;
  if (d.spot && d.spot.price) {
    const basis = ((i.price - d.spot.price) / d.spot.price) * 100;
    prov += `<span>${t.spot} ${d.spot.metal}: <b>${fmt(d.spot.price)}</b>`
          + (d.spot.source ? ` <i>${d.spot.source}</i>` : "") + `</span>`;
    // On a futures contract this gap is the basis; on the spot instrument it is
    // how closely the charted market tracks the live broker quote.
    const label = inst.kind==="futures" ? t.basis : t.track;
    prov += `<span>${label}: <b>${basis>=0?"+":""}${basis.toFixed(2)}%</b></span>`;
  } else if (d.spot && d.spot.error) {
    prov += `<span class="provmiss">${t.spot}: ${t.failed}</span>`;
  }
  prov += `</div>`;

  out.innerHTML = `
  <div class="grid">
    <div class="card pad">
      <div class="h"><h2>${t.reading} · ${d.symbol}</h2>
        <span class="badge b-live">${t.live}</span></div>
      ${prov}
      <div class="verdict">
        <div>
          <div class="dir ${dirCls}">${dirTxt}</div>
          <div class="chg" style="color:${i.change_pct>0?'var(--up)':i.change_pct<0?'var(--down)':'var(--dim)'}">
            ${i.change_pct>0?"▲":i.change_pct<0?"▼":"•"} ${Math.abs(i.change_pct).toFixed(2)}%</div>
        </div>
        <div style="flex:1">
          <div class="price">${fmt(i.price)} <span style="font-size:12px;color:var(--dim)">${d.currency||""}</span></div>
          <div class="sub" style="color:var(--dim);font-size:11.5px;margin-top:4px">
            ${t.agreement}: ${s.confidence}%  ·  ${d.exchange||""}</div>
          <div class="meter"><i style="width:${Math.max(s.confidence,2)}%"></i></div>
        </div>
      </div>
      <div class="kv">
        <div><span>${t.entry}</span><b>${fmt(s.entry)}</b></div>
        <div><span>${t.sl}</span><b style="color:var(--down)">${fmt(s.stop_loss)}</b></div>
        <div><span>${t.tp}</span><b style="color:var(--up)">${fmt(s.take_profit)}</b></div>
        <div><span>${t.rr}</span><b>${s.risk_reward}</b></div>
        <div><span>${t.support}</span><b>${fmt(i.support)}</b></div>
        <div><span>${t.resistance}</span><b>${fmt(i.resistance)}</b></div>
      </div>
      <div class="h" style="margin-top:18px"><h2>${t.chart}</h2>
        <span class="sub" style="color:var(--dim);font-size:11.5px">${d.interval}</span></div>
      <canvas id="cv"></canvas>
      ${warns?`<div class="warns">${warns}</div>`:""}
    </div>

    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="card pad">
        <div class="h"><h2>${t.ai}</h2></div>
        <div class="ai">
          <div class="meta">${aiMeta}<span>${t.agree}: ${s.confidence}%</span></div>
          ${d.narrative.text.replace(/\n/g,"<br>")}
        </div>
      </div>

      <div class="card pad">
        <div class="h"><h2>${t.why}</h2><span class="sub" style="color:var(--dim);font-size:11.5px">${t.sig}: ${s.direction} · ${s.score>0?"+":""}${s.score}</span></div>
        <div class="rules">${rules||`<div class="rule"><span class="dot"></span><span class="txt"><i>${t.neutral_note}</i></span><span class="w"></span></div>`}</div>
      </div>

      <div class="card pad">
        <div class="h"><h2>${t.rsi} / ${t.macd}</h2></div>
        <div class="kv">
          <div><span>${t.rsi}</span><b>${i.rsi}</b></div>
          <div><span>${t.macd}</span><b>${i.macd_hist}</b></div>
          <div><span>${t.stoch}</span><b>${i.stoch_k}</b></div>
          <div><span>${t.atr}</span><b>${i.atr_pct}%</b></div>
          <div><span>${t.bands}</span><b>${fmt(i.bb_lower)} – ${fmt(i.bb_upper)}</b></div>
          <div><span>EMA200</span><b>${fmt(i.ema200)}</b></div>
        </div>
      </div>
    </div>
  </div>`;

  drawChart();
}

async function drawChart(){
  const cv=document.getElementById("cv"); if(!cv) return;
  let data;
  try{
    const r=await fetch(`/api/candles?symbol=${encodeURIComponent(last.symbol)}&interval=${last.interval}`);
    data=(await r.json()).candles;
  }catch(e){ return; }
  const dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth, H=260;
  cv.width=W*dpr; cv.height=H*dpr;
  const x=cv.getContext("2d"); x.scale(dpr,dpr);
  x.clearRect(0,0,W,H);

  const pad=8, lo=Math.min(...data.map(c=>c.l)), hi=Math.max(...data.map(c=>c.h));
  const span=hi-lo||1;
  const Y=v=>pad+(hi-v)/span*(H-2*pad);
  const bw=(W-2*pad)/data.length;

  x.strokeStyle="rgba(255,255,255,.04)"; x.lineWidth=1;
  for(let g=0;g<=4;g++){const y=pad+g*(H-2*pad)/4;x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke();}

  data.forEach((c,k)=>{
    const cx=pad+k*bw, o=Y(c.o), cl=Y(c.c);
    const up=c.c>=c.o, col=up?"#26a269":"#e5534b";
    x.strokeStyle=col; x.fillStyle=col;
    x.beginPath(); x.moveTo(cx+bw/2, Y(c.h)); x.lineTo(cx+bw/2, Y(c.l)); x.stroke();
    const top=Math.min(o,cl), hgt=Math.max(Math.abs(cl-o),1);
    x.fillRect(cx+bw*0.15, top, Math.max(bw*0.7,1), hgt);
  });
}

document.getElementById("go").onclick=run;
boot();
</script>
</body>
</html>
